<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gramleagues – list view</title>
<meta name="description" content="Found a team on Instagram, collect likes, grow your stadium and win the monthly tournament.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="kopf">
  <a class="marke" href="#/" aria-label="Gramleagues home">
    <img src="logo.svg" alt="" width="40" height="40">
    <span>Gram<b>Leagues</b></span>
  </a>
  <nav class="nav" aria-label="Main menu">
    <a href="#/" data-nav="start">Teams</a>
    <a href="#/turnier" data-nav="turnier">Tournament</a>
    <a href="#/regeln" data-nav="regeln">Rules</a>
    <a href="index.html">3D stadium</a>
    <a href="#/archiv" data-nav="archiv">Archive</a>
  </nav>
  <form class="suche" id="suchform" role="search">
    <label for="suchfeld" class="sr">Search Instagram name</label>
    <input id="suchfeld" type="search" placeholder="search @yourname" autocomplete="off">
    <button type="submit" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
  </form>
</header>
<div id="demo" class="demo" hidden>Demo data: this is how the page looks with two simulated seasons. Once the bot runs, the real teams appear here.</div>
<main id="app" tabindex="-1"><p class="laden">Loading league …</p></main>
<footer class="fuss">
  <span id="stand"></span>
  <span>Gramleagues · play along on Instagram</span>
</footer>
<script src="app.js"></script>
</body>
</html>
