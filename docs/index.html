<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>gramleagues - build your team</title>
<meta name="description" content="Found a team on Instagram, collect likes, grow your stadium and find your seat.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="welt.css">
</head>
<body>
<div id="namensschilder" aria-hidden="true"></div>

<div id="kopf" class="karte">
  <div class="kopfzeile">
    <button id="zurueck" class="rund" hidden aria-label="Back to overview">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1><img src="logo.svg" alt="" class="logo" width="26" height="26"><span id="titel">Gram<b>Leagues</b></span><span class="tag" id="tag"></span></h1>
  </div>
  <div id="zeile"></div>
  <div id="balken" hidden><div></div></div>
  <div id="unterzeile"></div>
  <nav class="knoepfe" aria-label="Menu">
    <button data-panel="teams">Teams</button>
    <button data-panel="turnier">Tournament</button>
    <button data-panel="kader" id="kaderknopf" hidden>Squad</button>
    <button data-panel="regeln">Rules</button>
    <button data-panel="archiv">Archive</button>
  </nav>
</div>

<div id="unten" class="karte">
  <form id="suche" role="search">
    <label for="eingabe" class="sr">Your Instagram name</label>
    <input id="eingabe" placeholder="Your Instagram name" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button>Find my seat</button>
  </form>
  <div id="meldung"><span id="meldtext"></span><button type="button" id="schliessen">Back</button></div>
  <div id="hinweis">Players and named fans (reply <b>FAN</b>) get a seat with their name. Likes are anonymous fans.</div>
</div>

<div id="kamera">
  <button id="rein" aria-label="Zoom in">+</button>
  <button id="raus" aria-label="Zoom out">−</button>
  <button id="heim" aria-label="Back to overview">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
  </button>
</div>

<aside id="panel" aria-label="Details" hidden>
  <button id="panelzu" class="rund" aria-label="Close">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="panelinhalt"></div>
</aside>

<div id="hover" class="schild"></div>
<div id="mein" class="schild"></div>

<div id="wolken" role="status" aria-label="Loading">
  <canvas id="wolkenbild" aria-hidden="true"></canvas>
  <div class="wolkentext"></div>
</div>
<script>
/* Dichte Wolkenbank auf EINER Zeichenfläche (spart auf Handys viel Speicher), öffnet sich beim Start */
(function () {
  var c = document.getElementById("wolkenbild"), g = c.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5), W, H, puffs = [];
  var a = 9, z = function () { a = (a * 9301 + 49297) % 233280; return a / 233280; };
  var klein = Math.min(innerWidth, innerHeight) <= 600, n = klein ? 34 : 56;
  for (var i = 0; i < n; i++) puffs.push({ x: z() * 1.2 - 0.1, y: z() * 1.2 - 0.1, g: 0.28 + z() * 0.46, dx: 0, dy: 0, v: z() * 0.35 });
  puffs.forEach(function (p) { p.dx = (p.x - 0.5) * (2.4 + z()); p.dy = (p.y - 0.5) * (1.6 + z()) - 0.3; });
  function groesse() { W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; c.style.width = W + "px"; c.style.height = H + "px"; }
  function puff(x, y, r, alpha, s) {
    g.save(); g.globalAlpha = alpha; g.translate(x, y); g.scale(s, s * 0.72);
    var k = g.createRadialGradient(-r * 0.16, -r * 0.22, r * 0.05, 0, 0, r);
    k.addColorStop(0, "#FFFFFF"); k.addColorStop(0.5, "rgba(255,255,255,0.95)"); k.addColorStop(0.78, "rgba(238,242,248,0.88)"); k.addColorStop(1, "rgba(226,232,241,0)");
    g.fillStyle = k; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
    var u = g.createRadialGradient(0, r * 0.35, 0, 0, r * 0.35, r * 0.7);
    u.addColorStop(0, "rgba(176,190,210,0.22)"); u.addColorStop(1, "rgba(176,190,210,0)");
    g.fillStyle = u; g.beginPath(); g.arc(0, 0, r * 0.95, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  function zeichne(t) {
    var e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    var hg = g.createLinearGradient(0, 0, 0, H); hg.addColorStop(0, "#EEF2F7"); hg.addColorStop(1, "#FFFFFF");
    g.globalAlpha = Math.max(0, 1 - t * 1.6); g.fillStyle = hg; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
    var m = Math.max(W, H);
    puffs.forEach(function (p) {
      var k = Math.min(1, Math.max(0, (t - p.v * 0.25) / 0.9));
      var ek = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      puff((p.x + p.dx * ek) * W, (p.y + p.dy * ek) * H, p.g * m * 0.5, Math.max(0, 1 - ek * 1.05), 1 + ek * 0.8);
    });
  }
  groesse(); zeichne(0);
  addEventListener("resize", function () { if (!window.gramWolkenOffen) { groesse(); zeichne(0); } });
  window.gramWolkenAuf = function () {
    window.gramWolkenOffen = true;
    var t0 = performance.now(), d = 2800;
    (function schritt(jetzt) {
      var t = Math.min(1, (jetzt - t0) / d);
      zeichne(t);
      if (t < 1) requestAnimationFrame(schritt);
      else { document.getElementById("wolken").classList.add("weg"); c.width = c.height = 1; }
    })(t0);
  };
})();
</script>
<script>
/* Fallback: Wenn die 3D-Ansicht nicht starten kann, Wolken öffnen und zur Listenansicht verweisen */
window.gramFehler = function (grund) {
  if (window.gramFehlerGezeigt) return;
  window.gramFehlerGezeigt = true;
  var w = document.getElementById("wolken");
  w.style.pointerEvents = "auto";
  var t = w.querySelector(".wolkentext");
  t.innerHTML = '<div style="max-width:320px;text-align:center;font-size:18px;font-weight:600;line-height:1.4;color:#3C3E44">' +
    (grund || "The 3D stadium can't run on this device.") +
    '<br><a href="liste.html" style="display:inline-block;margin-top:14px;padding:12px 20px;border-radius:8px;background:#111113;color:#fff;text-decoration:none">Open the list view</a></div>';
};
window.addEventListener("error", function () { if (!window.gramGestartet) window.gramFehler(); });
window.addEventListener("unhandledrejection", function () { if (!window.gramGestartet) window.gramFehler(); });
setTimeout(function () { if (!window.gramGestartet) window.gramFehler("The 3D stadium is taking too long to load on this device."); }, 20000);
</script>
<script nomodule>location.replace("liste.html");</script>
<script type="module" src="welt.js"></script>
</body>
</html>
