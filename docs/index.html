<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gramleagues – the league in the comments</title>
<meta name="description" content="Found a team on Instagram, collect likes, grow your stadium and find your seat.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="welt.css">
</head>
<body>
<div id="namensschilder" aria-hidden="true"></div>

<div id="kopf" class="karte">
  <div class="kopfzeile">
    <button id="zurueck" class="rund" hidden aria-label="Back to overview">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <h1><img src="logo.svg" alt="" class="logo" width="26" height="26"><span id="titel">Gram<b>Leagues</b></span><span class="tag" id="tag"></span></h1>
  </div>
  <div id="zeile"></div>
  <div id="balken" hidden><div></div></div>
  <div id="unterzeile"></div>
  <nav class="knoepfe" aria-label="Menu">
    <button data-panel="teams">Teams</button>
    <button data-panel="turnier">Tournament</button>
    <button data-panel="kader" id="kaderknopf" hidden>Squad</button>
    <button data-panel="regeln">Rules</button>
    <button data-panel="archiv">Archive</button>
  </nav>
</div>

<div id="unten" class="karte">
  <form id="suche" role="search">
    <label for="eingabe" class="sr">Your Instagram name</label>
    <input id="eingabe" placeholder="Your Instagram name" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button>Find my seat</button>
  </form>
  <div id="meldung"><span id="meldtext"></span><button type="button" id="schliessen">Back</button></div>
  <div id="hinweis">Players and named fans (reply <b>FAN</b>) get a seat with their name. Likes are anonymous fans.</div>
</div>

<div id="kamera">
  <button id="rein" aria-label="Zoom in">+</button>
  <button id="raus" aria-label="Zoom out">−</button>
  <button id="heim" aria-label="Back to overview">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
  </button>
</div>

<aside id="panel" aria-label="Details" hidden>
  <button id="panelzu" class="rund" aria-label="Close">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="panelinhalt"></div>
</aside>

<div id="hover" class="schild"></div>
<div id="mein" class="schild"></div>

<div id="wolken" role="status" aria-label="Loading the league">
  <div class="wolkentext"></div>
</div>
<script>
/* Dichte Wolkenbank, die sich beim Start öffnet */
(function () {
  const w = document.getElementById("wolken");
  let a = 9;
  const z = () => { a = (a * 9301 + 49297) % 233280; return a / 233280; };
  for (let i = 0; i < 70; i++) {
    const el = document.createElement("i");
    const x = z() * 120 - 10, y = z() * 120 - 10, g = 28 + z() * 46;
    const dx = (x - 50) * (2.4 + z()), dy = (y - 50) * (1.6 + z()) - 30;
    el.style.cssText = `left:${x}vw;top:${y}vh;width:${g}vmax;height:${g * 0.72}vmax;--dx:${dx}vw;--dy:${dy}vh;transition-delay:${(z() * 0.35).toFixed(2)}s`;
    w.insertBefore(el, w.firstChild);
  }
})();
</script>
<noscript><p style="position:fixed;inset:auto 0 50% 0;text-align:center;color:#fff">Please enable JavaScript or open the <a href="liste.html">list view</a>.</p></noscript>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
<script type="module" src="welt.js"></script>
</body>
</html>
